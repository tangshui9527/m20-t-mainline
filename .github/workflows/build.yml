name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

env:
  # 7.0-based msm8909 tree; commit pinned by 3899/ufi210-debian (proven on
  # soc_id 245 = 0xf5, the same SoC as the M20-T). Multiple msm8909 devices
  # (nokia-leo, lenovo-p5100, zte-sapphire, zu02-dw01) boot this tree.
  KERNEL_REPO: https://github.com/weikaizhi4/linux
  KERNEL_COMMIT: 410d5647742474d7ed3eaa1b12aef09df18c2633
  CROSS: arm-linux-gnueabihf-
  DTB: qcom-msm8909-zu02-dw01

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            gcc-arm-linux-gnueabihf bison flex bc cpio libssl-dev \
            python3 ccache curl tar
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-armv7-${{ env.KERNEL_COMMIT }}-${{ hashFiles('configs/*.config', 'patches-msm8909-*.patch') }}
          restore-keys: ccache-armv7-${{ env.KERNEL_COMMIT }}-

      - name: Clone kernel
        run: |
          git clone --filter=blob:none --no-checkout "$KERNEL_REPO" linux
          cd linux
          git fetch --filter=blob:none origin "$KERNEL_COMMIT"
          git checkout --detach "$KERNEL_COMMIT"
          git log -1 --format="kernel %H %cs %s" | tee ../kernel-info.txt

      - name: Apply board DTS (zu02-dw01, proven on soc_id 245)
        run: |
          cd linux
          git apply ../patches-msm8909-zu02-dw01.patch
          grep -n zu02 arch/arm/boot/dts/qcom/Makefile

      - name: Configure (ufi210 reference config + initramfs overrides)
        run: |
          cp configs/msm8909-reference.config linux/.config
          cd linux
          # the M20-T initramfs brings up USB NCM from the RAM root: force builtin
          scripts/config --enable USB_CONFIGFS --enable USB_F_NCM \
                         --enable USB_CHIPIDEA_UDC
          make ARCH=arm CROSS_COMPILE="$CROSS" olddefconfig
          scripts/config --enable USB_CONFIGFS --enable USB_F_NCM \
                         --enable USB_CHIPIDEA_UDC
          make ARCH=arm CROSS_COMPILE="$CROSS" olddefconfig
          f() { grep -E "^$1" .config || echo "MISSING $1"; }
          f CONFIG_USB_CONFIGFS=
          f CONFIG_USB_F_NCM=
          f CONFIG_USB_CHIPIDEA_UDC=
          f CONFIG_WCN36XX=
          f CONFIG_EXT4_FS=
          f CONFIG_MMC_BLOCK=
          f CONFIG_PINCTRL_MSM8909=
          f CONFIG_QCOM_SMD_RPM=

      - name: Build kernel + dtb
        run: |
          cd linux
          make -j"$(nproc)" ARCH=arm CROSS_COMPILE="$CROSS" zImage dtbs
          ls -l arch/arm/boot/zImage
          ls -l arch/arm/boot/dts/qcom/$DTB.dtb

      - name: Build modules
        run: |
          ROOT="$PWD"
          cd linux
          make -j"$(nproc)" ARCH=arm CROSS_COMPILE="$CROSS" modules
          make ARCH=arm INSTALL_MOD_PATH="$ROOT/modout" modules_install
          cd "$ROOT"
          tar -C modout -caf modules.tar.xz lib/modules
          ls -l modules.tar.xz

      - name: Build initramfs
        run: bash initramfs/build.sh

      - name: Pack boot image
        run: |
          # Boot under lk2nd (raw DTB; lk2nd also fixes up the DT for the board).
          # The stock-aboot QCDT-wrapped variant is produced alongside so the same
          # kernel can go back into the stock chain if ever needed.
          python3 tools/mkbootimg.py \
            --kernel linux/arch/arm/boot/zImage \
            --ramdisk initramfs/initramfs.cpio.gz \
            --dtb linux/arch/arm/boot/dts/qcom/$DTB.dtb \
            --cmdline 'console=ttyHSL0,115200,n8' \
            --bootimg m20t-boot.img
          python3 tools/wrap-dt-qcdt.py wrap \
            linux/arch/arm/boot/dts/qcom/$DTB.dtb $DTB.qcdt
          python3 tools/mkbootimg.py \
            --kernel linux/arch/arm/boot/zImage \
            --ramdisk initramfs/initramfs.cpio.gz \
            --dtb $DTB.qcdt \
            --cmdline 'console=ttyHSL0,115200,n8' \
            --bootimg m20t-boot-qcdt.img
          ls -l m20t-boot.img m20t-boot-qcdt.img
          [ "$(stat -c%s m20t-boot.img)" -lt 33554432 ] || { echo "BOOT IMAGE TOO BIG"; exit 1; }

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp m20t-boot.img m20t-boot-qcdt.img \
             linux/arch/arm/boot/zImage \
             linux/arch/arm/boot/dts/qcom/$DTB.dtb \
             initramfs/initramfs.cpio.gz \
             modules.tar.xz \
             kernel-info.txt \
             out/
          ccache -s || true

      - uses: actions/upload-artifact@v4
        with:
          name: m20t-mainline-boot
          path: out/
          retention-days: 90
