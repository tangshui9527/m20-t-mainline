name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/msm8916-mainline/linux
  KERNEL_TAG: v6.12.1-msm8916
  CROSS: arm-linux-gnueabihf-

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            gcc-arm-linux-gnueabihf bison flex bc cpio libssl-dev \
            python3 ccache curl tar
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-armv7-${{ env.KERNEL_TAG }}-${{ hashFiles('kernel-release.config', 'device/*.dts') }}
          restore-keys: ccache-armv7-${{ env.KERNEL_TAG }}-

      - name: Clone kernel
        run: |
          git clone --depth 1 --branch "$KERNEL_TAG" "$KERNEL_REPO" linux
          cd linux
          git log -1 --format="kernel %H %cs %s" | tee ../kernel-info.txt

      - name: Install board DTS
        run: |
          cp device/qcom-msm8909-hisense-m20t.dts \
             linux/arch/arm/boot/dts/qcom/
          sed -i '/qcom-msm8909-fareastone-smart506.dtb/a\                    qcom-msm8909-hisense-m20t.dtb \\' \
             linux/arch/arm/boot/dts/qcom/Makefile
          grep -n hisense linux/arch/arm/boot/dts/qcom/Makefile

      - name: Configure (pmOS armv7 base + initramfs overrides)
        run: |
          cp kernel-release.config linux/.config
          # initramfs must bring up USB NCM without a rootfs: force builtin
          sed -i 's/^CONFIG_USB_CONFIGFS=m/CONFIG_USB_CONFIGFS=y/' linux/.config
          sed -i 's/^CONFIG_USB_F_NCM=m/CONFIG_USB_F_NCM=y/' linux/.config
          cd linux
          make ARCH=arm CROSS_COMPILE="$CROSS" olddefconfig
          f() { grep -E "^$1" .config || echo "MISSING $1"; }
          f CONFIG_USB_CONFIGFS=
          f CONFIG_USB_F_NCM=
          f CONFIG_USB_CHIPIDEA_UDC=
          f CONFIG_WCN36XX=
          f CONFIG_EXT4_FS=
          f CONFIG_MMC_BLOCK=
          f CONFIG_PINCTRL_MSM8909=

      - name: Build kernel + dtb
        run: |
          cd linux
          make -j"$(nproc)" ARCH=arm CROSS_COMPILE="$CROSS" zImage dtbs
          ls -l arch/arm/boot/zImage
          ls -l arch/arm/boot/dts/qcom/qcom-msm8909-hisense-m20t.dtb

      - name: Build modules
        run: |
          cd linux
          make -j"$(nproc)" ARCH=arm CROSS_COMPILE="$CROSS" modules
          make ARCH=arm INSTALL_MOD_PATH="$PWD/../modout" modules_install
          tar -C modout -caf ../modules.tar.xz lib/modules
          ls -l ../modules.tar.xz

      - name: Build initramfs
        run: bash initramfs/build.sh

      - name: Pack boot image
        run: |
          python3 tools/mkbootimg.py \
            --kernel linux/arch/arm/boot/zImage \
            --ramdisk initramfs/initramfs.cpio.gz \
            --dtb linux/arch/arm/boot/dts/qcom/qcom-msm8909-hisense-m20t.dtb \
            --cmdline 'console=ttyHSL0,115200,n8' \
            --bootimg m20t-boot.img
          ls -l m20t-boot.img
          [ "$(stat -c%s m20t-boot.img)" -lt 33554432 ] || { echo "BOOT IMAGE TOO BIG (boot part = 32MiB)"; exit 1; }

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp m20t-boot.img \
             linux/arch/arm/boot/zImage \
             linux/arch/arm/boot/dts/qcom/qcom-msm8909-hisense-m20t.dtb \
             initramfs/initramfs.cpio.gz \
             modules.tar.xz \
             kernel-info.txt \
             out/
          ccache -s || true

      - uses: actions/upload-artifact@v4
        with:
          name: m20t-mainline-boot
          path: out/
          retention-days: 90
